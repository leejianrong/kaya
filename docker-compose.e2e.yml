# Overlay for `make test-e2e` (KAN-1070), composed on top of docker-compose.yml rather than standing
# alone:
#
#     docker compose -f docker-compose.yml -f docker-compose.e2e.yml -p <project> up -d --build --wait
#
# `scripts/test-e2e.sh` is the only thing that should invoke this; it picks its own
# COMPOSE_PROJECT_NAME and ports so an e2e run never touches a developer's persistent `make up`
# volume — see docker-compose.yml's own header on why that matters for parallel worktrees, and the
# same argument applies doubly here since a test run tears its stack down with `-v` when it's done.
#
# Used to also start a `fake-pandan` stand-in for pandan's `GET /api/v1/me` — ADR 0002's identity
# resolver forwarded every bearer there. ADR 0012's cutover (KAN-1740) deleted that call entirely:
# kaya now authenticates against its own `kaya_account`/`personal_access_token` tables and never
# talks to pandan to do it. `fake-pandan` had nothing left to stand in for, so it is gone
# (`scripts/e2e/fake_pandan.py` deleted with it); `scripts/test-e2e.sh` seeds a real `kaya_pat_…`
# for the suite to use instead, straight into this stack's own database.
#
# `KAYA_PANDAN_URL` is still real configuration post-cutover — ADR 0011's team-default access still
# calls pandan (and still soft-fails per ADR 0003 if it can't be reached) — so the app still needs a
# value here. Pointed at a closed local port rather than the real, live
# `simple-kanban-jian.fly.dev`: a loopback connection refused is an instant, offline-safe failure,
# where the real deployment would cost every note-list request a live network round trip (or, if it
# had scaled to zero, the multi-second cold start ADR 0002's amendment measured) for a fallback this
# suite never exercises the success path of. `backend/tests/integration/test_pandan_down.py` and
# `test_team_default_access_api.py` are what actually prove the soft-fail path in detail; this
# overlay only needs it to be *fast*.
services:
  app:
    environment:
      KAYA_PANDAN_URL: http://127.0.0.1:1
