[project]
name = "kaya-client"
version = "0.1.0"
description = "The shared core for kaya: the API client and the one payload-shaping seam"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# No runtime dependencies yet. `httpx` arrives with KayaClient in V2a (KAN-54x); adding it now
# would be a dependency with no caller.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaya_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
