[project]
name = "kaya-client"
# 0.11.0 — KAN-550 adds ADR 0005 §contract 8's `help[]` next-step templates: `hints.help_lines` and
# `hints.help_block`, keyed on the payload's own `kind` and `noun` and never on a verb name, with
# every placeholder left unfilled. They are **human-only** — suppressed under `json`, `toon` and
# `data` (SLICES §V2b) — which is deliberately the reverse of KAN-547's truncation hint: a true
# total is a fact about *this* payload that a structured consumer cannot otherwise obtain, while a
# template is a static string an agent learns once from `--help`. Behavioural for every caller of
# `render(..., fmt="human")`, which is why it is a minor bump; no structured output changed a byte.
# `render`'s signature did not move, for the fifth consecutive V2b card.
# 0.10.0 — KAN-551 completes the client's CRUD surface and PLAN §Config's second tier. New:
# `create_note`, `update_note`, `move_note` (which *is* `update_note` — ADR 0008 makes a move a
# `PATCH` to one column) and `delete_note`, every one of them through the one `_note_path` that
# percent-encodes a ref as a single segment. ADR 0009's precondition is forwarded as an opaque
# string so nothing in this package can lose a microsecond. Also the user config file — JSON under
# `$XDG_CONFIG_HOME/kaya/config.json`, consulted per key after the environment — and the three
# `config` verbs as `Payload` builders (`settings_payload`, `path_payload`, `write_settings`). A
# write merges onto what is already there, so a hand-set `max_text_chars` survives a
# `config set --api-url`. Behavioural for every existing caller: `api_url`, `token` and
# `max_text_chars` now consult a file they previously could not see. `render`'s signature did not
# move (ADR 0005's sequencing rule), for the fourth consecutive V2b card.
# 0.9.0 — KAN-548 fills `render`'s last empty step: `aggregates.attach_summary` puts
# `{"count": n}` on a collection and nothing on an entity, rendered as a trailing `2 notes`
# under `human` and as a `summary` key elsewhere. Behavioural for every caller of `render`
# on a list. (Recorded here by KAN-551, which found the version bumped without an entry.)
# 0.8.0 — KAN-547 fills `render`'s last no-op parameter: `text_limit` truncates the fields
# `Payload.prose_fields` names, appending a hint that carries the **true** total **in-band**, so the
# total reaches `json`/`toon`/`data` and a truncated value is still a string with no key added,
# removed or retyped (ADR 0005 §contract 6). `0` disables it and is what `--full` resolves to; the
# default comes from `config.max_text_chars`, new public API over `KAYA_MAX_TEXT_CHARS`. Behavioural
# for every caller of `render` that did not pass `text_limit`, which is why it is a minor bump: a
# `note get` on a long note now prints 500 characters and a hint. 0.7.0 was KAN-546's `--fields`
# projection. `render`'s signature did not move for either (ADR 0005's sequencing rule).
# 0.6.0 — KAN-716 reconciles this package's request deadline with the backend's authentication
# budget after KAN-666 split it. `DEFAULT_TIMEOUT` is an `httpx.Timeout` built from
# `DEFAULT_CONNECT_TIMEOUT` (5 s) and `DEFAULT_READ_TIMEOUT` (40 s), where it was a single 30 s
# float that a cold authentication — connect 5 s plus read 30 s — could outlast. Behavioural on
# both axes: a request waits longer for an answer, and gives up sooner on a host that never
# accepts the connection. `timeout=` still takes a float, and still means one deadline for every
# phase when it does. Same card, same hole one path over: `open_client(transport=…)` built its
# injected client with httpx's own 5 s default, so the shipped deadline applied to every session
# except the one an adapter injects a transport into.
# 0.5.0 — KAN-541 registers the `toon` format (encoder in `toon.py`, stdlib-only and encode-only),
# adds `config` — PLAN §Config's environment tier and `open_client()` — and `MissingCredential`.
# It also fixes a defect the verbs made reachable: `get_note` percent-encodes the ref, so
# `#NOTE-12` reaches the API's one ref resolver instead of being eaten as a URL fragment. New
# public API plus a behavioural fix, so a minor bump.
# 0.4.0 — KAN-542 adds the failure half of the output layer: `error_payload()`, `render_error()`,
# and a `code` on every exception class. New public API and a new `UsageError`, so a minor bump.
# 0.3.0 — KAN-543 adds `provenance`, the build stamp both adapters read. 0.2.0 was KAN-540's
# `KayaClient` and `render()` seam. A behavioural change to a shipped package bumps it in the same
# PR (ADR 0007 §3, CLAUDE.md §Conventions §Versioning).
version = "0.11.0"
description = "The shared core for kaya: the API client and the one payload-shaping seam"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # The transport for `KayaClient`, and the only runtime dependency this package has. The
    # serializers are stdlib — `json` for `--format json`, and `toon` is specified stdlib-only and
    # encode-only (SLICES §V2a) — so shaping stays free of anything that could pull a wheel in
    # behind an adapter's back.
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaya_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
