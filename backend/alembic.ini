# A generic, single database configuration.

[alembic]
# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = %(here)s/alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.  for multiple paths, the path separator
# is defined by "path_separator" below.
prepend_sys_path = .


# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# The path separator used here should be the separator specified by "path_separator"
# below.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator; This indicates what character is used to split lists of file
# paths, including version_locations and prepend_sys_path within configparser
# files such as alembic.ini.
# The default rendered in new alembic.ini files is "os", which uses os.pathsep
# to provide os-dependent path splitting.
#
# Note that in order to support legacy alembic.ini files, this default does NOT
# take place if path_separator is not present in alembic.ini.  If this
# option is omitted entirely, fallback logic is as follows:
#
# 1. Parsing of the version_locations option falls back to using the legacy
#    "version_path_separator" key, which if absent then falls back to the legacy
#    behavior of splitting on spaces and/or commas.
# 2. Parsing of the prepend_sys_path option falls back to the legacy
#    behavior of splitting on spaces, commas, or colons.
#
# Valid values for path_separator are:
#
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
#
# Use os.pathsep. Default configuration used for new projects.
path_separator = os

# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# database URL. Deliberately NOT set here: env.py takes it from app.config, which reads
# DATABASE_URL. One source of truth means a migration can never run against a different
# database than the app — and it keeps a credential out of a tracked file.
# sqlalchemy.url =


[post_write_hooks]
# Reflow a generated revision so it is lint-clean as written (KAN-692).
#
# `alembic/script.py.mako` gets a generated revision's *scaffolding* right (KAN-665). What no
# template edit can reach is the body: autogenerate's renderer emits each `sa.Column(...)`, each
# `sa.ForeignKeyConstraint(...)` and each `sa.UniqueConstraint(...)` on one line, and one carrying
# a timezone, a server default and a `nullable=` runs past this repo's 100-column limit. Measured
# on KAN-692 through the real command (Postgres 17, `upgrade head`, `DROP TABLE note_link`,
# `DROP TABLE note`, `alembic revision --autogenerate`): **nine** E501s in a file nobody had typed
# a character into. Revisions 0001 and 0003 have hand-wrapped columns for exactly that reason, and
# that tax is per-revision and compounding — the cheap way out of it is `--no-verify`, which is the
# one habit this repo cannot afford.
#
# Four things about the hook below are decisions rather than the obvious spelling.
#
# 1. `ruff format`, NOT `ruff check --fix`. E501 has no autofix. Measured on a real generated
#    revision: `ruff check --fix` reports the long line and rewrites nothing, while `ruff format`
#    splits the call onto one argument per line and takes eight of those nine findings out. Only
#    one of ruff's two operations does the job this hook exists for, and it is not the one whose
#    name contains "fix".
#
# 2. ONE hook, not a `check --fix` pass beside it. `script.py.mako` *guesses* which of `op` and
#    `sa` the rendered body needs and appends autogenerate's own extra imports after them; its
#    comments say in as many words that ruff reporting a wrong guess (I001, F401, F821) is the
#    wanted outcome. A `--fix` pass would silently sort or delete its way out of that, so the one
#    alarm the template deliberately kept would stop ringing. There is nothing else in a generated
#    revision for it to fix, so a second hook buys a hidden failure and no lint.
#
# 3. `type = module`, not `console_scripts` and not `exec`. ruff ships **no** console-script entry
#    point at all — there is no `entry_points.txt` in its dist-info, the `ruff` binary is a script
#    dropped straight into the venv's `bin/` — so `console_scripts` cannot resolve it and alembic
#    raises `Could not find entrypoint console_scripts.ruff`. (That is why alembic's own stock
#    comments, deleted below, use `console_scripts` for black and `module` for ruff.) `module` runs
#    `sys.executable -m ruff`, so it resolves in the interpreter alembic is already running under —
#    `backend/.venv`, where `uv sync --all-extras` puts ruff from the `dev` extra — rather than in
#    whatever `PATH` happens to hold, which is what `exec` would depend on. A checkout that can run
#    `alembic` at all has run `make install` and therefore has ruff.
#
# 4. `REVISION_SCRIPT_FILENAME` is written out rather than left implicit. Alembic *prepends* the
#    token when the options string does not contain it, which here would run `ruff <file> format`.
#
# THE HONEST LIMIT: no formatter can break a long *string literal*. The ninth finding in that
# measurement is `note.search_vector` rendered as
# `sa.Computed("setweight(to_tsvector('english', ...)) || ...", persisted=True)` — 224 characters
# whose overrun is one string, so `ruff format` reflows the call around it and the line stays long.
# That still *reports* rather than slipping through, so it costs a hand wrap on the rare revision
# that renders one. `tests/unit/test_alembic_post_write_hooks.py` pins it, so nobody reads this
# hook as a total solution.
#
# AND THE HOOK CANNOT FAIL LOUDLY ON A BAD OPTIONS STRING, which is why the guard is behavioural
# rather than "assert this section exists". `alembic/script/write_hooks.py`'s `_run_hook` calls
# `subprocess.run` with no `check=`, so a hook whose command exits non-zero — `formatt` instead of
# `format`, an unknown flag — prints ruff's complaint and generates the revision anyway. A missing
# *module* is the loud case: `CommandError`, raised before any subprocess starts.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging configuration.  This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
