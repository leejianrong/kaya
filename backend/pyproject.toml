[project]
name = "kaya-backend"
version = "0.1.0"
description = "kaya notes API — FastAPI over sync SQLAlchemy and Postgres"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # ADR 0001: FastAPI, SYNC SQLAlchemy over psycopg v3, Alembic from day one.
    # There is deliberately no fastapi-users, no OAuth client and no async driver.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.19.0",
    "pydantic-settings>=2.7",
    # Runtime, not just test tooling, since KAN-534: the principal resolver calls pandan's
    # `GET /api/v1/me` over httpx (ADR 0002). It doubles as fastapi.testclient's transport.
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.ruff.lint.isort]
# `alembic/` is a directory in this project, which makes ruff read the alembic package as
# first-party. Say otherwise, so import order in env.py stays conventional.
known-first-party = ["app"]
known-third-party = ["alembic"]
