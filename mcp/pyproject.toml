[project]
name = "kaya-mcp"
version = "0.3.0"
description = "kaya's MCP server — a thin adapter over kaya-client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "kaya-client",
    "mcp>=1.2.0",
]
# KAN-569 lands the MCP SDK: the six tools ADR 0006 froze are now real, so the dependency that
# stands the server up finally has tools behind it. KAN-964 (0.3.0) made the sixth one work — it had
# refused every call since KAN-569, because ADR 0006 froze the name before KAN-566 built the layers
# behind it. A behavioural change to a shipped package, hence the minor bump (ADR 0007 §3).

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
kaya-mcp = "kaya_mcp.__main__:main"

[tool.uv.sources]
# Adapters depend on the client, never the reverse (ADR 0004).
kaya-client = { path = "../kaya-client", editable = true }

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaya_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
