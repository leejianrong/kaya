[project]
name = "kaya-mcp"
version = "0.1.0"
description = "kaya's MCP server — a thin adapter over kaya-client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "kaya-client",
]
# The MCP SDK is deliberately absent until V6 (KAN-56x) actually stands the server up. ADR 0006
# freezes the tool set there; a dependency with no tools behind it is weight, not progress.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv.sources]
# Adapters depend on the client, never the reverse (ADR 0004).
kaya-client = { path = "../kaya-client", editable = true }

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaya_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
