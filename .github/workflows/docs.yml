name: Docs

# Docs-as-code (KAN-1194, EPIC-172/R17): render docs/guide to a static site with
# Zensical (https://zensical.org, the successor to Material for MkDocs).
#
# Build-check only, for now — every PR and every push to main. `zensical build
# --strict` turns build warnings (notably a broken internal .md link) into a
# non-zero exit, so a docs break fails the check BEFORE it can reach main.
#
# GATE-SAFE, same philosophy as ci.yml: the `Docs build check` job runs and
# reports on EVERY pull request (it is fast — a frozen install plus a small
# build), so if it is wired in as a required status check it never leaves a PR
# hanging at "Expected".
#
# No publish job yet, and no `pages`/`id-token` permissions — those land in
# KAN-1197 alongside the maintainer's one-time repo setting (Settings → Pages
# → "Build and deployment" → Source = "GitHub Actions") and real content worth
# publishing. Until then this workflow only ever reads the repo.
#
# Action pin: astral-sh/setup-uv takes an exact patch tag, matching ci.yml —
# see that file's header for why (setup-uv stopped publishing floating major/
# minor tags at v8.0.0).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docs build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: docs-tooling/uv.lock

      # Build from the repo root so zensical.toml's docs_dir="docs/guide" resolves.
      # `--frozen` installs exactly docs-tooling/uv.lock (reproducible, cached);
      # `--strict` fails the build on any warning (broken internal .md links
      # included); `--clean` rebuilds from scratch.
      - name: Build docs (strict)
        run: uv run --project docs-tooling --frozen zensical build --strict --clean
