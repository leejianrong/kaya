name: CI

# One job per concern, run in parallel, with lockfile-frozen installs and caching
# (dev-playbook §7). Language jobs are gated on the package actually existing, so
# this workflow is honest about a repo that is currently plan-only: it runs the
# checks that apply and skips the rest instead of going red for being unbuilt.
#
# Action pins: bump these when the runner flags a Node runtime deprecation, and
# check composite wrappers for transitive pins at the same time. There are no
# composite wrappers today — this is the only file under .github/ — so a bump is
# a sweep of this file alone, but check again before assuming that still holds.
#
# Bumped for the Node 20 deprecation in KAN-582, and the two pin styles below are
# deliberate rather than inconsistent. actions/* publish floating major tags, so
# `@v7` tracks patches on its own. astral-sh/setup-uv stopped publishing major and
# minor tags at v8.0.0 (upstream issue #830), so it takes an exact patch tag and
# `@v9` fails the run outright as an unresolvable action. That also means setup-uv
# gets no patches until someone bumps this line by hand.
#
# One silent default moved in that jump and is left at its new value on purpose:
# setup-uv v9 flips `prune-cache` from true to false, so cache entries get bigger
# rather than wrong. Every job here sets `cache-dependency-glob` explicitly, which
# keeps each package on its own cache key and sidesteps the broadened v6 default.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Directory existence rather than a changed-paths filter: it needs no third-party
  # action, works identically on push and pull_request, and has no base-ref edge case
  # on a first commit.
  detect:
    name: Detect packages
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      client: ${{ steps.d.outputs.client }}
      cli: ${{ steps.d.outputs.cli }}
      mcp: ${{ steps.d.outputs.mcp }}
      frontend: ${{ steps.d.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        run: |
          for p in backend client cli mcp frontend; do
            case $p in
              client) dir=kaya-client ;;
              cli)    dir=kaya-cli ;;
              *)      dir=$p ;;
            esac
            if [ -d "$dir" ]; then echo "$p=true" >> "$GITHUB_OUTPUT"; else echo "$p=false" >> "$GITHUB_OUTPUT"; fi
          done
          cat "$GITHUB_OUTPUT"

  docs:
    name: Docs, secrets and image pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The default secret scan reads tracked files at the checked-out commit and would
          # be correct on a depth-1 clone. Full history stays because `secret-scan.sh
          # --history` would not be: gitleaks scans the commits it can see, so a shallow
          # clone makes that audit silently partial instead of failing. KAN-580.
          fetch-depth: 0
      - name: Internal doc links
        run: scripts/check-docs-links.sh
      # Byte-for-byte the command the pre-push hook runs, against a gitleaks pinned by
      # version and sha256 in scripts/ensure-gitleaks.sh — so "green locally" and "green in
      # CI" are claims about the same scanner and the same rules. Deliberately not
      # gitleaks-action: that is a second mechanism to keep in step with the local one, and
      # its licence key becomes mandatory the day this repo moves under an organisation.
      - name: Secret scan
        run: scripts/secret-scan.sh
      # KAN-538, and it belongs with the other offline guards rather than in a job of its own: it
      # reads the *shape* of an image reference and asks no registry anything, so it needs neither
      # Docker nor a network and costs a second. The job is required via `ci-gate`, which needs
      # job ids rather than display names — so renaming this one above is safe.
      - name: Image pins (digests, not tags)
        run: scripts/check-image-pins.sh

  backend:
    name: Backend (lint + unit)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - working-directory: backend
        run: uv sync --frozen --all-extras
      - working-directory: backend
        run: uv run ruff check .
      - working-directory: backend
        run: uv run pytest tests/unit -q

  client:
    name: Client (lint + unit)
    needs: detect
    if: needs.detect.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: kaya-client/uv.lock
      - working-directory: kaya-client
        run: uv sync --frozen --all-extras
      - working-directory: kaya-client
        run: uv run ruff check .
      # ADR 0004: render() is the seam both adapters go through, so its own suite is
      # where projection, truncation and format guarantees are actually proven.
      - working-directory: kaya-client
        run: uv run pytest -q

  cli:
    name: CLI (lint + unit)
    needs: detect
    if: needs.detect.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version-bump guard needs the merge-base with main
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: kaya-cli/uv.lock
      - working-directory: kaya-cli
        run: uv sync --frozen --all-extras
      - working-directory: kaya-cli
        run: uv run ruff check .
      - working-directory: kaya-cli
        run: uv run pytest -q

  # KAN-544. A job of its own, and NOT gated on `detect`, because ADR 0007 §3 scopes the guard to
  # all three shipped packages. It lived in the `cli` job until this card, where a PR touching only
  # `kaya-client` or only `mcp` never ran it — two thirds of the packages it is supposed to cover.
  # There is exactly one of these; the placeholder that used to sit in `cli` is gone.
  version-bump:
    name: Version-bump guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Non-negotiable. The guard diffs against `git merge-base HEAD origin/main` — never the
          # remote tip, which is pandan's open KAN-484 — and a shallow clone has no merge-base to
          # find. It fails loudly rather than skipping in that case, so this line going missing is
          # a red check and not a silently disabled guard.
          fetch-depth: 0
      - run: scripts/check-version-bump.sh

  mcp:
    name: MCP (lint + unit)
    needs: detect
    if: needs.detect.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock
      - working-directory: mcp
        run: uv sync --frozen --all-extras
      - working-directory: mcp
        run: uv run ruff check .
      # ADR 0006: the frozen tool set, the tool count and the MCP ⊆ CLI parity check
      # all live in this suite. A new tool without a CLI verb must fail here.
      - working-directory: mcp
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + unit + build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint --if-present
      - working-directory: frontend
        run: npm test --if-present
      - working-directory: frontend
        run: npm run build

  integration:
    name: Integration (real Postgres)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - working-directory: backend
        run: uv sync --frozen --all-extras
      # Self-provisioning via testcontainers (dev-playbook §A6) — no hand-managed DB
      # service block, so the same command works locally and here.
      - working-directory: backend
        run: uv run pytest tests/integration -q

  # A single stable required status check. Without this, branch protection has to name
  # every job, and a legitimately SKIPPED job (a package that doesn't exist yet) leaves
  # a required check permanently pending and blocks every PR.
  ci-gate:
    name: CI gate
    needs: [detect, docs, backend, client, cli, version-bump, mcp, frontend, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "✗ an upstream job failed or was cancelled"
          exit 1
      - name: Pass
        run: echo "✓ all applicable jobs passed or were skipped"
