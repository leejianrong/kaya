# kaya's Fly.io deployment (KAN-1044/1045, ADR 0010's 2026-09-02 amendment).
#
# Independent of pandan's own Fly app (`simple-kanban-jian`) and of the k8s homelab (`KAN-439`) —
# this is the escape hatch ADR 0010 named, exercised on its own timeline. It deploys the same
# `Dockerfile` `make up` and `deploy/k8s/` already exercise; nothing here is a second artifact.
#
# Written by hand rather than generated by `flyctl launch`'s scanner, so every setting here is one
# that was decided rather than guessed — the same preference this repo has everywhere else for a
# reviewed choice over a default nobody chose.
#
# Deploy with `scripts/fly-deploy.sh`, not a bare `flyctl deploy` — it passes the same provenance
# build-args `scripts/image-build.sh` computes for `docker build`, so `org.opencontainers.image.revision`
# on the deployed image is true here too, not `unknown`.

app = "kaya-jian"
# Matches pandan's own region (`simple-kanban-jian` runs in `iad`) rather than a region picked for
# the human operator's location — every kaya request that needs `GET /api/v1/me` (ADR 0002) hops to
# pandan, and that hop's latency is the one KAN-1047 measures for real. Co-locating removes a cross-
# region leg from a number this ADR amendment is explicitly trying to learn honestly.
primary_region = "iad"

[build]

[deploy]
  # Runs `alembic upgrade head` in a one-off machine, using the same secrets as the app, before
  # the new release takes traffic. Mirrors docker-compose.yml's separate one-shot migration
  # service — "the schema is current" stays a visible step with its own exit code (see the
  # Dockerfile's own comment on why no migration runs inside CMD).
  release_command = "alembic upgrade head"

[env]
  # DATABASE_URL is a secret (`fly secrets set`) — Neon's connection string carries a password.
  # KAYA_PANDAN_URL is not (app/config.py's own docstring: it appears verbatim in a 503 body), so
  # it lives here in plain sight rather than in `fly secrets`.
  KAYA_PANDAN_URL = "https://simple-kanban-jian.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale-to-zero, matching pandan's own `min_machines_running = 0` (ADR 0010's amendment already
  # prices this trade: a cold start is a real wait, not a fault, and KAN-1047 measures it for real
  # against this origin instead of assuming pandan's numbers carry over).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "10s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
