[project]
# PLAN §Naming: the PyPI *distribution* name is `kaya-notes` — bare `kaya` is an abandoned stub
# (pandan ADR 0018 §Package-name reality). That constrains the distribution name only. The console
# script is `kaya`, and there is exactly one of them (Q39).
name = "kaya-notes"
# 0.17.0 — KAN-1200 (R18/EPIC-173) ships `kaya-cli/src/kaya_cli/skills/kaya/SKILL.md`, checked in
# and packaged (`[tool.hatch.build.targets.wheel]` already includes the whole `src/kaya_cli` tree,
# and the PyInstaller `--add-data "kaya_cli/skills:kaya_cli/skills"` line carries it into the
# onefile, mirroring pandan's own KAN-431 line). `context install`/`context uninstall` now also lay
# down/remove that skill at `~/.claude/skills/kaya/SKILL.md` (or `$CLAUDE_CONFIG_DIR`-relative),
# alongside the hook write — `--no-skill` opts a single install out, `--keep-skill` a single
# uninstall out. Ported pandan's own KAN-505 stamp/compare mechanism
# (`stamp_line`/`parse_stamp`/`strip_stamp`/`compare_skill`, an HTML-comment build stamp on the
# copy `install` writes) so a locally modified or newer-build skill is never silently overwritten or
# downgraded — `--force-skill` is the explicit override, refused (not merely discouraged) when the
# installed copy is stamped by a newer build than this one. `context status` reports the skill's
# state (not installed / matches / stale / locally modified / newer-than-this-build) the same way
# pandan's `_skill_status_lines` does. Behavioural — `install`/`uninstall` now have a new on-disk
# side effect and three new flags that used to be usage errors — so a minor bump.
# 0.16.0 — KAN-1198 (R18/EPIC-173, ADR 0005) adds `context {install,uninstall,status,print}`, the
# ambient Claude Code SessionStart hook that gives an agent session the caller's recent notes
# before it has to ask (mirrors pandan V48/KAN-431's `pandan_cli/context.py`). `context install`
# writes an idempotent hook entry into a `.claude/settings.json` (read-modify-write, refusing a
# non-object `hooks`/`hooks.SessionStart` key rather than overwriting it); `context uninstall`
# removes exactly the matching entries and needs no configuration; `context status` is read-only;
# `context print` reuses `KayaClient.recent_notes` — the exact call bare `kaya` already makes, no
# new client payload shape — through the normal render() pipeline, while `context print --hook` is
# a *new*, separate code path with its own tight timeout (`HOOK_TIMEOUT_SECONDS = 5.0`, independent
# of `kaya_client.client.DEFAULT_READ_TIMEOUT`'s 40 s cold-start budget) that never raises and never
# exits non-zero — a caught failure is one line on stderr, discarded by the hook harness's exit 0,
# with nothing at all on stdout. Card originally guessed flat `install-context`/`uninstall-context`
# verbs; this ships pandan's actual nested `context` group instead, with the fourth word spelled
# `print` rather than pandan's own `show` (kaya already has `config show`, and
# `mcp/tests/test_cli_parity.py`'s reader refuses two verbs sharing a bare word). Behavioural — four
# new words that used to be usage errors now do something — so a minor bump.
# 0.15.0 — KAN-1087 adds `--team ID` to `note create` alone (ADR 0011/R16.6), forwarded to
# `kaya-client` 0.16.0's new `create_note(team_id=...)`. A plain numeric id — a team has no ref of
# its own to spell instead, and `pandan team list` (pandan owns team CRUD entirely, kaya never
# grows its own) is how a caller finds one. 403 from the API for a team the caller does not belong
# to; this package adds no client-side validation of its own, the same restraint every other verb
# already shows. New public API — an optional flag on an existing verb — so a minor bump; every
# other verb and every existing `note create` invocation is unchanged.
# 0.14.0 — KAN-1060..1063 add R12's export/import verbs: `note export <ref>` and
# `note import <file>` (single note), `export-all <dir>` and `import-all <dir>` (corpus) — four
# new words dispatched through the same `verbs.VERBS` table every other verb uses, each one
# `open a session → call one kaya-client method → return the Payload`, same as ever (ADR 0004).
# The corpus pair is not spelled `export`/`import`: `mcp/tests/test_cli_parity.py`'s word-keyed
# reader refuses two `add_parser`s sharing a word, which BREADBOARD.md's original `export --all`/
# `import --dir` draft would have tripped. No opinion added here either way — `--out` and the two
# `directory` positionals are argv, and every byte of the front-matter shape and the ref-claiming
# decision (`note import` tries to reclaim the file's own free ref before minting a fresh one)
# lives in `kaya-client` 0.15.0, `imported_from_ref`/`ref_reused` included. Behavioural — four
# verbs that used to be usage errors now do something — so a minor bump.
# 0.13.0 — KAN-839 adds `422` → exit `2` (`EXIT_USAGE`) to `EXIT_FOR_STATUS`. Behavioural: a
# malformed `--if-updated-at` (`kaya note edit … --if-updated-at nope`) and every other request
# body a `NoteCreate`/`NoteUpdate` schema refuses used to exit `1` and now exits `2`, so a script
# branching on the number sees a different answer for the same event. An *addition*, not a
# renumber — `0/1/2/3/4/5/6` are where ADR 0005 §contract 4 already put them — and the cheapest of
# the three additions to this table so far, because reusing `EXIT_USAGE` needs no new constant and
# no widened published-range literal. KAN-724's amendment had left `422` at the unmapped `1` on the
# theory that its `code` string already named the action better than a number could; ADR 0005's
# 2026-08-23 amendment corrects that once grepping `backend/` showed `422` has exactly one source
# — `app/api/errors.py::handle_validation_error`, wired only to a request body failing schema
# validation — which makes it the same *kind* of caller mistake `400` already is, not the kind
# `409` is. `invalid_request` is not in `EXIT_FOR_CODE`, for the reason `invalid_note_ref` isn't.
# 0.11.0 — KAN-559 adds `--q` to `note list` alone (not to `output_flags()`'s shared parent, since
# it names a request parameter and not an output-shaping flag every verb inherits). Argv reaches
# `KayaClient.list_notes(args.q)` untouched — `None` when the flag is absent, forwarded verbatim
# otherwise — and a present-but-blank term is `app/api/search.py`'s `400 empty_search_query`,
# which already exits `2` via `EXIT_FOR_STATUS` with nothing new to add. Behavioural: `note list`
# now accepts a flag that used to be a usage error, so a minor bump.
# 0.10.0 — KAN-724 adds `409` → exit `6` (`EXIT_CONFLICT`) to `EXIT_FOR_STATUS`. Behavioural, and
# behavioural in the way exit codes are versioned for: a stale `--if-updated-at` used to exit `1` and
# now exits `6`, so a script branching on the number sees a different answer for the same event. An
# *addition* to the status table, not a renumber — `0/1/2/3/4/5` are where ADR 0005 §contract 4 put
# them — but the first addition that published a new **number**, which is why ADR 0005 gained the
# 2026-08-12 amendment arguing that a seventh meaning is not the reuse the ADR warned against: `409`
# is neither kaya failing (`1`) nor the caller's input being wrong (`2`), and ADR 0009's two whole
# notes make re-read-and-retry the correct action, which `1` puts out of reach. Keyed on the status,
# so the next `409` code needs no edit; `422` and everything else keep the `1` default. Pandan's
# matching row is its KAN-831.
# 0.9.0 — KAN-549 lands SLICES §V2b step 4, ADR 0005 §contract 7's content-first bare invocation,
# and completes V2b. Bare `kaya` was a banner and an epilogue that exited `0` on any machine; it now
# opens a session, prints three banner lines and the caller's five most recently updated notes with
# the aggregate over *those five*, and exits `0`. **Behavioural on the exit code**: with no token
# configured it is exit `1` and `error<TAB>no_credential<TAB>…` on stdout where it used to be `0`
# and a banner — which is contract 7's own note ("no token → a structured auth error") and the
# reason this is a bump rather than a docs change. `--help` and `--version` are untouched, and both
# still answer before anything opens a session. It is dispatched as `verbs.BARE`, a row in the same
# table as every other verb, so `render` is still called in exactly one place in this package — the
# banner is `kaya_client.overview`, takes no `Payload`, and is joined to the render by `BLOCK_GAP`
# on the one `print`. `executable_path()` is this package's share and the only new logic: `argv[0]`
# resolved through `PATH`, or `sys.executable` in a frozen build.
# 0.8.0 — KAN-551 lands SLICES §V2b step 6: the full verb set. `note create`, `note edit`,
# `note move` and `note delete` join the two reads, and `config {set,show,path}` arrives as a
# second dispatch table for the verbs that need no session — `config show` has to answer when
# there is no credential, because finding that out is what it is for. `--body`/`--body-file` are
# mutually exclusive and there is no `-`, so `tests/test_no_prompting.py` keeps proving ADR 0005
# §contract 9 structurally. Behavioural on every axis: argv that used to be a usage error now
# writes a note, and `config set` writes a file. Shaping, resolution and the file format are all
# `kaya-client`'s; this package's share is the subparsers, one file read and a merge it does not
# perform. One behaviour moved rather than arrived: `main` resolves `KAYA_MAX_TEXT_CHARS`
# from the payload instead of before the verb, so a value nothing can parse no longer
# refuses `config path` — the verb that answers which file to fix. `note list` still exits
# `2` on one, but now after its request rather than before it.
# 0.7.0 — KAN-547 adds `--full` to every verb and reads `KAYA_MAX_TEXT_CHARS`, so prose is cut to
# 500 characters by default with a hint carrying the true total. Behavioural for every existing
# invocation that prints a long body, and a new exit `2` path: a `KAYA_MAX_TEXT_CHARS` that is not
# a whole number is a structured refusal on stdout rather than a traceback. The cut, the allow-list
# and the number all live in `kaya-client`; this package's share is a `store_true` and one
# precedence (`resolve_text_limit`). 0.6.0 was KAN-546's `--fields`.
# 0.5.0 — KAN-718 adds `400` → exit `2` to `EXIT_FOR_STATUS`. Behavioural, and the reason exit
# codes are versioned at all: a malformed ref (ADR 0008's `#NOTE-12`) used to exit `1` and now
# exits `2`. An *addition* to the status table, not a renumber — every shipped number is where
# ADR 0005 §contract 4 put it, and the ADR's wording for `2` was widened to match.
# 0.4.0 — KAN-541 gives the CLI its first verbs, `note list` and `note get <ref>`, and ADR 0005
# §contract 1's `--format {human,json,toon}` with `--json` as a documented alias. Behavioural on
# every axis: argv that used to be a usage error now makes a request.
# 0.3.0 — KAN-542: a failure is a structured row on stdout plus argparse's usage on stderr, and
# `failures.py` publishes ADR 0005's exit-code table. Behavioural: argv that used to exit with
# argparse's own `2` now exits with this repository's `2`, from a table a test pins.
# 0.2.0 — KAN-543 gives the CLI argument parsing and ADR 0007's build-stamped `--version`. A
# behavioural change to a shipped package bumps it in the same PR (ADR 0007 §3, CLAUDE.md
# §Conventions §Versioning).
version = "0.17.0"
description = "kaya — the notes CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "kaya-client",
]

[project.scripts]
kaya = "kaya_cli.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv.sources]
# The dependency arrow points one way: an adapter depends on the client, never the reverse
# (ADR 0004). A path source keeps that arrow real in-tree without a release cycle between them.
kaya-client = { path = "../kaya-client", editable = true }

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaya_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
